# 出勤之後｜刊登後台設定（Sveltia CMS）
# 後台編輯畫面：https://after-the-call.github.io/after-the-call/admin/editor/（入口總覽頁在 /admin/）
# 團隊在後台按「儲存」後，內容會存進 GitHub 的 content/ 資料夾，網站約 1 到 2 分鐘後更新。
# 每則公告、每則動態各是一個檔案；狀態分「草稿／上架／下架」，只有「上架」會出現在網站上。
backend:
  name: github
  repo: after-the-call/after-the-call
  branch: main
  # 「使用 GitHub 登入」走這個免費登入服務（Cloudflare Workers 上的 sveltia-cms-auth，放在 jiajiasyuan 的 Cloudflare 帳號）
  base_url: https://sveltia-cms-auth.jiajiasyun.workers.dev

site_url: https://after-the-call.github.io/after-the-call/
display_url: https://after-the-call.github.io/after-the-call/
logo_url: https://after-the-call.github.io/after-the-call/admin/logo.svg

media_folder: assets/uploads
public_folder: assets/uploads

collections:
  - name: notices
    label: 公告
    label_singular: 公告
    icon: campaign
    description: 新增的公告預設是「草稿」，確認內容沒問題後，把狀態改成「上架」再儲存，網站才會出現。
    folder: content/notices
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "【{{status}}】{{title}}"
    sortable_fields:
      - {field: date, label: 日期, default_sort: desc}
      - {field: title, label: 標題}
      - {field: status, label: 狀態}
    view_filters:
      - {label: 只看草稿, field: status, pattern: 草稿}
      - {label: 只看上架中, field: status, pattern: 上架}
      - {label: 只看已下架, field: status, pattern: 下架}
      - {label: 只看置頂, field: pinned, pattern: true}
    view_groups:
      - {label: 依狀態分組, field: status}
      - {label: 依類型分組, field: type}
    fields:
      - {name: title, label: 標題, widget: string}
      - name: status
        label: 狀態
        widget: select
        options: [草稿, 上架, 下架]
        default: 草稿
        hint: 草稿＝還在寫，網站看不到；上架＝公開；下架＝暫時收起來，資料保留。
      - {name: pinned, label: 置頂, widget: boolean, default: false, hint: 打開後會固定排在最前面，首頁輪播也優先。}
      - {name: hot, label: 放進首頁輪播, widget: boolean, default: true}
      - name: type
        label: 類型
        widget: select
        options: [Podcast, 招募, 調查, 活動, 課程, 其他]
        required: false
        hint: 公告頁會依類型自動做出篩選按鈕。
      - name: date
        label: 日期
        widget: datetime
        type: date
        default: "{{now}}"
        hint: 用來排序，新的排前面。
      - name: date_text
        label: 顯示的日期文字
        widget: string
        required: false
        hint: 選填。想顯示「2027-02 中旬（預定）」這類文字時填這裡，不填就顯示上面的日期。
      - name: summary
        label: 摘要
        widget: text
        required: false
        hint: 列表上顯示的一兩句話。不填的話會自動用內容的開頭。
      - name: body
        label: 內容
        widget: markdown
        required: false
        hint: 點進公告後看到的完整內容。可以分段、加粗、條列、插入連結或圖片。
      - name: images
        label: 照片
        label_singular: 照片
        widget: list
        required: false
        hint: 第一張會放在標題下方當主圖，其餘排在內容後面。
        summary: "{{fields.cap}}"
        fields:
          - {name: src, label: 照片檔, widget: image}
          - {name: cap, label: 圖說, widget: string, required: false}
      - name: links
        label: 連結按鈕
        label_singular: 連結
        widget: list
        required: false
        hint: 第一個會是橘色主要按鈕，例如「立即報名」。
        summary: "{{fields.text}}"
        fields:
          - {name: text, label: 按鈕文字, widget: string, hint: 例如「立即報名」「填寫問卷」}
          - {name: url, label: 網址, widget: string, pattern: ['^https?://', '請貼上 http 或 https 開頭的完整網址']}

  - name: updates
    label: 最新動態
    label_singular: 動態
    icon: timeline
    description: 計畫進度紀錄。新增時預設是「草稿」，改成「上架」才會出現在網站。
    folder: content/updates
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "【{{status}}】{{title}}"
    sortable_fields:
      - {field: date, label: 日期, default_sort: desc}
      - {field: title, label: 標題}
    view_filters:
      - {label: 只看草稿, field: status, pattern: 草稿}
      - {label: 只看上架中, field: status, pattern: 上架}
      - {label: 只看已下架, field: status, pattern: 下架}
    view_groups:
      - {label: 依狀態分組, field: status}
      - {label: 依類別分組, field: tag}
    fields:
      - {name: title, label: 標題, widget: string}
      - {name: status, label: 狀態, widget: select, options: [草稿, 上架, 下架], default: 草稿}
      - name: tag
        label: 類別
        widget: select
        options: [調查, Podcast, 試點, 倡議, 課程, 團隊]
        required: false
      - {name: date, label: 日期, widget: datetime, type: date, default: "{{now}}", hint: 用來排序，新的排前面。}
      - {name: date_text, label: 顯示的日期文字, widget: string, required: false, hint: 選填，例如「2026-秋」。不填就顯示上面的日期。}
      - name: body
        label: 內容
        widget: markdown
        required: false
        hint: 可以分段、加粗、條列、插入連結。
      - name: images
        label: 照片
        label_singular: 照片
        widget: list
        required: false
        hint: 可以放多張，會排在內容下面，點了可以看大圖。
        summary: "{{fields.cap}}"
        fields:
          - {name: src, label: 照片檔, widget: image}
          - {name: cap, label: 圖說, widget: string, required: false}
      - name: links
        label: 連結按鈕
        label_singular: 連結
        widget: list
        required: false
        hint: 例如「活動照片集」「新聞報導」「完整報告」。
        summary: "{{fields.text}}"
        fields:
          - {name: text, label: 按鈕文字, widget: string}
          - {name: url, label: 網址, widget: string, pattern: ['^https?://', '請貼上 http 或 https 開頭的完整網址']}

  - name: settings
    label: 網站設定
    icon: settings
    files:
      - name: settings
        label: 首頁公告輪播
        file: content/settings.json
        format: json
        fields:
          - name: hot_count
            label: 首頁輪播最多幾則
            widget: number
            value_type: int
            default: 5
            min: 1
            max: 10
            hint: 置頂的公告優先，再依日期由新到舊補滿這個數量。
