<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>刊登後台｜出勤之後</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="admin.css?v=2">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="./"><img src="logo.svg" alt=""><span>出勤之後 刊登後台<small>After the Call</small></span></a>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <a class="link" href="editor/">完整編輯畫面</a>
  <a class="link" href="../" target="_blank" rel="noopener">看網站 ↗</a>
</div></header>

<main id="app"><p class="note">載入中…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const REPO='after-the-call/after-the-call', BRANCH='main', API='https://api.github.com';
  const KINDS={
    notices:{label:'公告',dir:'content/notices',coll:'notices',pin:true},
    updates:{label:'最新動態',dir:'content/updates',coll:'updates',pin:false}
  };
  const STATUSES=['草稿','上架','下架'];
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app=$('#app');

  /* 登入資訊沿用編輯畫面（Sveltia CMS）存在這個瀏覽器的登入狀態 */
  function user(){try{return JSON.parse(localStorage.getItem('sveltia-cms.user')||'null')}catch(e){return null}}
  function token(){const u=user();return u&&u.token}
  function gate(msg){
    app.innerHTML=`<div class="gate"><h1>請先登入</h1><p>${esc(msg||'用 GitHub 帳號登入後，就能在這裡管理公告和最新動態。')}</p>
      <a class="btn primary" href="editor/">前往登入</a><p class="hint">登入完成後，按左下角「← 回總覽」回到這裡。</p></div>`;
  }

  let toastT;
  function toast(t,err){const el=$('#toast');el.textContent=t;el.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast'+(err?' err':''),err?6000:3200)}

  async function gh(path,opt={}){
    const r=await fetch(API+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token(),'X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})}));
    if(r.status===401){gate('登入已過期，請重新登入一次。');throw new Error('401')}
    if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
    return r.status===204?null:r.json();
  }
  const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
  const b64enc=s=>{const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)};

  async function loadKind(k){
    const dir=KINDS[k].dir;let files=[];
    try{files=await gh(`/repos/${REPO}/contents/${dir}?ref=${BRANCH}&t=${Date.now()}`)}catch(e){if(e.status===404)return [];throw e}
    files=files.filter(f=>f.type==='file'&&f.name.endsWith('.json'));
    const items=await Promise.all(files.map(async f=>{
      const d=await gh(`/repos/${REPO}/contents/${f.path}?ref=${BRANCH}&t=${Date.now()}`);
      let data={};try{data=JSON.parse(b64dec(d.content))}catch(e){}
      return {id:f.name.replace(/\.json$/,''),path:f.path,sha:d.sha,data};
    }));
    return items.sort((a,b)=>String(b.data.date||'').localeCompare(String(a.data.date||''))||String(a.data.title||'').localeCompare(String(b.data.title||'')));
  }

  const state={kind:'notices',filter:'全部',q:'',items:{}};
  try{const s=sessionStorage.getItem('atc-admin-kind');if(KINDS[s])state.kind=s}catch(e){}

  function render(){
    const K=KINDS[state.kind],all=state.items[state.kind]||[];
    const count=s=>all.filter(i=>(i.data.status||'草稿')===s).length;
    const q=state.q.trim().toLowerCase();
    const list=all.filter(i=>(state.filter==='全部'||(i.data.status||'草稿')===state.filter)&&(!q||String(i.data.title||'').toLowerCase().includes(q)));
    app.innerHTML=`<div class="tabs" role="tablist">${Object.entries(KINDS).map(([k,v])=>`<button role="tab" data-kind="${k}" aria-selected="${k===state.kind}">${v.label}</button>`).join('')}</div>
      <div class="bar">
        <div class="chips">${['全部',...STATUSES].map(s=>`<button data-filter="${s}" aria-pressed="${s===state.filter}">${s==='全部'?'全部':s==='上架'?'上架中':s==='下架'?'已下架':'草稿'}<b>${s==='全部'?all.length:count(s)}</b></button>`).join('')}</div>
        <input class="search" type="search" placeholder="搜尋標題" value="${esc(state.q)}" aria-label="搜尋標題">
        <span style="flex:1"></span>
        <a class="btn primary" href="edit.html?kind=${state.kind}">＋ 新增${K.label}</a>
      </div>
      <div class="list">${list.length?list.map(row).join(''):`<p class="empty">${all.length?'沒有符合的項目。':'還沒有任何'+K.label+'，按右上角「新增」開始。'}</p>`}</div>
      <p class="hint">在這裡切換狀態或置頂會馬上存檔，網站約 1 到 2 分鐘後更新。只有「上架」的會出現在網站上。要改標題、內容、照片或連結，按「編輯」。</p>`;
    const s=app.querySelector('.search');s.oninput=()=>{state.q=s.value;const pos=s.selectionStart;render();const n=app.querySelector('.search');n.focus();n.setSelectionRange(pos,pos)};
  }
  function row(i){
    const K=KINDS[state.kind],d=i.data,st=d.status||'草稿';
    const date=d.date_text||d.date||'';
    return `<div class="row" data-id="${esc(i.id)}">
      <div class="main"><div class="t">${esc(d.title||'（沒有標題）')}</div>
        <div class="meta">${date?`<span>${esc(date)}</span>`:''}${(d.type||d.tag)?`<span class="type">${esc(d.type||d.tag)}</span>`:''}</div></div>
      <div class="seg" role="group" aria-label="狀態">${STATUSES.map(s=>`<button data-act="status" data-s="${s}" aria-pressed="${s===st}">${s}</button>`).join('')}</div>
      ${K.pin?`<button class="pin" data-act="pin" aria-pressed="${!!d.pinned}">${d.pinned?'已置頂':'置頂'}</button>`:'<span></span>'}
      <div class="acts"><a href="edit.html?kind=${state.kind}&id=${encodeURIComponent(i.id)}">編輯</a>
        ${st!=='上架'&&state.kind==='notices'?`<a href="../notice.html?preview#${encodeURIComponent(i.id)}" target="_blank" rel="noopener">預覽</a>`:''}
        <button class="del" data-act="del">刪除</button></div>
    </div>`;
  }

  async function save(item,patch,msg){
    const data=Object.assign({},item.data,patch);
    const body=JSON.stringify(data,null,2)+'\n';
    const put=sha=>gh(`/repos/${REPO}/contents/${item.path}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64enc(body),sha,branch:BRANCH})});
    let r;
    try{r=await put(item.sha)}catch(e){
      if(e.status!==409&&e.status!==422)throw e;
      /* 別人剛好也改了這個檔：拿最新版，只套用這次的變更 */
      const cur=await gh(`/repos/${REPO}/contents/${item.path}?ref=${BRANCH}&t=${Date.now()}`);
      item.data=JSON.parse(b64dec(cur.content));item.sha=cur.sha;return save(item,patch,msg);
    }
    item.data=data;item.sha=r.content.sha;
  }

  app.addEventListener('click',async e=>{
    const tab=e.target.closest('[data-kind]');if(tab){state.kind=tab.dataset.kind;state.filter='全部';state.q='';try{sessionStorage.setItem('atc-admin-kind',state.kind)}catch(x){}render();return}
    const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return}
    const b=e.target.closest('[data-act]');if(!b)return;
    const r=b.closest('.row'),items=state.items[state.kind],item=items.find(x=>x.id===r.dataset.id);if(!item)return;
    const title=item.data.title||'';
    if(b.dataset.act==='del'){
      if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='確定刪除？';setTimeout(()=>{if(b.isConnected){b.classList.remove('confirm');b.textContent='刪除'}},4000);return}
      r.classList.add('busy');
      try{await gh(`/repos/${REPO}/contents/${item.path}`,{method:'DELETE',body:JSON.stringify({message:`刪除${KINDS[state.kind].label}「${title}」`,sha:item.sha,branch:BRANCH})});
        state.items[state.kind]=items.filter(x=>x!==item);render();toast(`已刪除「${title}」`)}
      catch(err){r.classList.remove('busy');if(err.message!=='401')toast('刪除失敗，請重新整理再試一次。',true)}
      return;
    }
    let patch,msg,done;
    if(b.dataset.act==='status'){const s=b.dataset.s;if((item.data.status||'草稿')===s)return;patch={status:s};msg=`將${KINDS[state.kind].label}「${title}」設為${s}`;done=s==='上架'?`已上架，網站約 1 到 2 分鐘後出現`:s==='下架'?'已下架，網站約 1 到 2 分鐘後收起':'已改回草稿'}
    else if(b.dataset.act==='pin'){const p=!item.data.pinned;patch={pinned:p};msg=`${p?'置頂':'取消置頂'}公告「${title}」`;done=p?'已置頂':'已取消置頂'}
    r.classList.add('busy');
    try{await save(item,patch,msg);render();toast(done)}
    catch(err){r.classList.remove('busy');if(err.message!=='401')toast('儲存失敗，請重新整理再試一次。',true)}
  });

  async function start(){
    const u=user();
    if(!token()){gate();return}
    $('#who').textContent=u.login?('已登入：'+u.login):'';
    try{
      const [n,up]=await Promise.all([loadKind('notices'),loadKind('updates')]);
      state.items={notices:n,updates:up};render();
    }catch(e){if(e.message!=='401')app.innerHTML='<p class="note err">讀取資料失敗。請重新整理；如果一直失敗，請到「完整編輯畫面」重新登入。</p>'}
  }
  start();
  /* 在別的分頁登入或登出時，自動重新載入 */
  window.addEventListener('storage',e=>{if(e.key==='sveltia-cms.user')start()});
})();
</script>
</body>
</html>
