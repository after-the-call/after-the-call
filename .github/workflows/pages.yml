# 部署網站：每次 main 有更新（包含在後台按儲存），整理 content/ 的公告與動態，再發布到 GitHub Pages。
name: 部署網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 整理公告與動態
        run: node scripts/build-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub 偶爾會暫時找不到剛上傳的檔案，等一下再試一次
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
